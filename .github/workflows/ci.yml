name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test pure portfolio logic
        run: pnpm test

      - name: Type-check and build
        run: pnpm build

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Verify grid production preview
        shell: bash
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4331 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4331/ > /dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4331 VERIFY_OUTPUT=artifacts/grid-release node scripts/verify-grid.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-release-browser
          path: artifacts/grid-release/
          if-no-files-found: ignore
